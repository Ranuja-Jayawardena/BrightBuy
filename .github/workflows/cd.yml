name: Continuous Deployment (CD)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            echo "=== Starting Automated Deployment to AWS EC2 ==="
            cd /home/ubuntu/BrightBuy

            echo "=== Pulling Latest Changes from origin/main ==="
            git fetch origin main
            git checkout main
            git pull origin main

            echo "=== Rebuilding and Launching Production Containers ==="
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build --remove-orphans

            echo "=== Verifying Stack Health ==="
            sleep 8
            curl -f http://localhost/api/health || (echo "Health check failed!" && exit 1)

            echo "=== Deployment Succeeded! ==="
